<style>

:root{--green:#145703;--green-light:#1d7a04;--green-glow:#2a9e06;--green-muted:#0e3d02;--dark:#0d0d0d;--dark-surface:#141414;--dark-card:#1a1a1a;--dark-border:#2a2a2a;--white:#f5f5f0;--gray:#888880;--gray-light:#b0b0a8;--font-display:'Barlow Condensed',sans-serif;--font-body:'Barlow',sans-serif;--nav-height:72px;--max-width:1200px;--transition:0.25s ease}

img{max-width:100%;display:block}

h3{font-size:clamp(1.4rem,2.5vw,1.9rem)}
h4{font-size:1.2rem}
p{font-size:1rem;color:var(--gray-light)}
.section-label{font-family:var(--font-display);font-size:0.75rem;font-weight:600;letter-spacing:0.18em;text-transform:uppercase;color:var(--green-glow);display:block;margin-bottom:0.5rem}

.site-nav{position:fixed;top:0;left:0;right:0;z-index:1000;height:var(--nav-height);background:rgba(13,13,13,0.95);backdrop-filter:blur(12px);border-bottom:1px solid var(--dark-border)}
.nav-inner{max-width:var(--max-width);margin:0 auto;padding:0 2rem;height:100%;display:flex;align-items:center;justify-content:space-between;gap:2rem}
.nav-logo img{height:36px;width:auto}
.nav-links{display:flex;align-items:center;gap:0.25rem}
.nav-links a{font-family:var(--font-display);font-size:0.82rem;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:var(--gray-light);padding:0.45rem 0.85rem;border-radius:3px;transition:color var(--transition),background var(--transition)}
.nav-links a:hover,.nav-links a.active{color:var(--white);background:rgba(20,87,3,0.35)}
.nav-links a.active{color:var(--green-glow)}
.nav-cta{color:var(--white)!important;background:var(--green)!important;padding:0.5rem 1.1rem!important;border-radius:3px}
.nav-cta:hover{background:var(--green-light)!important}
.nav-toggle{display:none;flex-direction:column;gap:5px;cursor:pointer;padding:4px;background:none;border:none}
.nav-toggle span{display:block;width:24px;height:2px;background:var(--white);transition:transform 0.3s,opacity 0.3s}
.nav-toggle.open span:nth-child(1){transform:translateY(7px) rotate(45deg)}
.nav-toggle.open span:nth-child(2){opacity:0}
.nav-toggle.open span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}
.page-header{padding:calc(var(--nav-height) + 4rem) 0 4rem;border-bottom:1px solid var(--dark-border);position:relative;overflow:hidden}
.page-header::before{content:'';position:absolute;top:0;left:0;right:0;bottom:0;background:linear-gradient(135deg,rgba(20,87,3,0.12) 0%,transparent 60%);pointer-events:none}
.page-header h1{margin-bottom:0.75rem}
.page-header p{font-size:1.15rem;max-width:620px;color:var(--gray-light)}
.divider{width:48px;height:3px;background:var(--green);margin:1.25rem 0 2rem}
.btn{display:inline-block;font-family:var(--font-display);font-size:0.85rem;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;padding:0.85rem 2rem;border-radius:3px;cursor:pointer;transition:background var(--transition),color var(--transition),border-color var(--transition);border:1px solid transparent}
.btn-primary{background:var(--green);color:var(--white);border-color:var(--green)}
.btn-primary:hover{background:var(--green-light);border-color:var(--green-light)}
.btn-outline{background:transparent;color:var(--green-glow);border-color:var(--green)}
.btn-outline:hover{background:rgba(20,87,3,0.2)}
.card{background:var(--dark-card);border:1px solid var(--dark-border);border-radius:4px;padding:2rem;transition:border-color var(--transition),transform var(--transition)}
.card:hover{border-color:var(--green-muted);transform:translateY(-3px)}
.card-icon{width:44px;height:44px;background:rgba(20,87,3,0.25);border-radius:4px;display:flex;align-items:center;justify-content:center;margin-bottom:1.25rem}
.card-icon svg{width:22px;height:22px;stroke:var(--green-glow);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.card h3{font-size:1.25rem;margin-bottom:0.75rem;color:var(--white)}
.card p{font-size:0.95rem}
.project-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:1.5rem}
.project-card{position:relative;aspect-ratio:4/3;overflow:hidden;border-radius:4px;background:var(--dark-card);border:1px solid var(--dark-border);cursor:pointer}
.project-card img{width:100%;height:100%;object-fit:cover;transition:transform 0.5s ease,filter 0.5s ease;filter:brightness(0.65) saturate(0.8)}
.project-card:hover img{transform:scale(1.05);filter:brightness(0.5) saturate(0.7)}
.project-card-label{position:absolute;bottom:0;left:0;right:0;padding:1.5rem 1.25rem 1.25rem;background:linear-gradient(transparent,rgba(0,0,0,0.85));font-family:var(--font-display);font-weight:600;font-size:1.05rem;letter-spacing:0.03em;color:var(--white);text-transform:uppercase}
.project-placeholder{width:100%;height:100%;background:var(--dark-card);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:0.5rem;color:var(--gray);font-family:var(--font-display);font-size:0.85rem;letter-spacing:0.08em;text-transform:uppercase}
.team-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:2rem}
.team-card{background:var(--dark-card);border:1px solid var(--dark-border);border-radius:4px;overflow:hidden;transition:border-color var(--transition)}
.team-card:hover{border-color:var(--green-muted)}
.team-photo{width:100%;aspect-ratio:3/3.5;object-fit:cover;object-position:center top;filter:grayscale(20%)}
.team-photo-placeholder{width:100%;aspect-ratio:3/3.5;background:var(--dark-border);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:3rem;font-weight:700;color:var(--green);letter-spacing:0.05em}
.team-info{padding:1.5rem}
.team-info h4{font-family:var(--font-display);font-size:1.2rem;font-weight:700;letter-spacing:0.05em;text-transform:uppercase;margin-bottom:0.25rem}
.team-info .role{font-size:0.85rem;color:var(--green-glow);font-weight:400;margin-bottom:1rem}
.team-links{display:flex;gap:0.5rem}
.team-links a{display:flex;align-items:center;justify-content:center;width:32px;height:32px;border:1px solid var(--dark-border);border-radius:3px;transition:border-color var(--transition),background var(--transition)}
.team-links a:hover{border-color:var(--green);background:rgba(20,87,3,0.2)}
.team-links svg{width:14px;height:14px;fill:var(--gray-light)}
.pillars-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:1.5rem;margin-top:3rem}
.locations-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:1.5rem;margin-top:2rem}
.location-card{background:var(--dark-card);border:1px solid var(--dark-border);border-radius:4px;padding:1.5rem}
.location-card h4{font-family:var(--font-display);font-size:0.85rem;letter-spacing:0.1em;color:var(--green-glow);margin-bottom:0.5rem;text-transform:uppercase}
.location-card p{font-size:0.88rem;line-height:1.5;color:var(--gray-light)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:1.25rem}
.form-full{grid-column:1/-1}
.form-group{display:flex;flex-direction:column;gap:0.5rem}
.form-group label{font-family:var(--font-display);font-size:0.78rem;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:var(--gray)}
.form-group input,.form-group select,.form-group textarea{background:var(--dark-card);border:1px solid var(--dark-border);border-radius:3px;color:var(--white);font-family:var(--font-body);font-size:0.95rem;padding:0.75rem 1rem;outline:none;transition:border-color var(--transition);-webkit-appearance:none}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--green)}
.form-group textarea{resize:vertical;min-height:140px}
.form-group select option{background:var(--dark-card)}
.site-footer{background:var(--dark-surface);border-top:1px solid var(--dark-border);padding:4rem 0 2rem}
.footer-inner{display:grid;grid-template-columns:1.5fr 1fr 1fr;gap:3rem;margin-bottom:3rem}
.footer-brand img{height:40px;margin-bottom:1.25rem}
.footer-brand p{font-size:0.9rem;color:var(--gray);max-width:280px}
.footer-col h5{font-family:var(--font-display);font-size:0.75rem;font-weight:600;letter-spacing:0.15em;text-transform:uppercase;color:var(--green-glow);margin-bottom:1rem}
.footer-col ul{display:flex;flex-direction:column;gap:0.5rem}
.footer-col ul li a{font-size:0.9rem;color:var(--gray);transition:color var(--transition)}
.footer-col ul li a:hover{color:var(--white)}
.footer-col address{font-style:normal;font-size:0.88rem;color:var(--gray);line-height:1.8}
.footer-bottom{border-top:1px solid var(--dark-border);padding-top:1.5rem;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:1rem}

.social-links{display:flex;gap:0.75rem}
.social-links a{display:flex;align-items:center;justify-content:center;width:34px;height:34px;border:1px solid var(--dark-border);border-radius:3px;transition:border-color var(--transition),background var(--transition)}
.social-links a:hover{border-color:var(--green);background:rgba(20,87,3,0.2)}
.social-links svg{width:14px;height:14px;fill:var(--gray-light)}

.coming-soon h3{color:var(--gray);margin-bottom:0.5rem}
.coming-soon p{font-size:0.9rem}
.site-intro{padding:calc(var(--nav-height) + 5rem) 0 5rem;position:relative;overflow:hidden}
.site-intro::before{content:'';position:absolute;top:-50%;left:-20%;width:700px;height:700px;background:radial-gradient(circle,rgba(20,87,3,0.18) 0%,transparent 65%);pointer-events:none}
.intro-grid{display:grid;grid-template-columns:1fr 1fr;gap:4rem;align-items:center}
.intro-text h1{margin-bottom:1.25rem}
.intro-text p{font-size:1.1rem;margin-bottom:2rem;max-width:520px}
.intro-actions{display:flex;gap:1rem;flex-wrap:wrap}
.intro-stats{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--dark-border);border:1px solid var(--dark-border);border-radius:4px;overflow:hidden}
.stat-item{background:var(--dark-card);padding:2rem 1.5rem;text-align:center}
.stat-number{font-family:var(--font-display);font-size:3rem;font-weight:700;color:var(--green-glow);line-height:1;display:block;margin-bottom:0.35rem}
.stat-label{font-size:0.8rem;letter-spacing:0.08em;text-transform:uppercase;color:var(--gray);font-family:var(--font-display);font-weight:500}
.services-strip{background:var(--dark-surface);border-top:1px solid var(--dark-border);border-bottom:1px solid var(--dark-border);padding:3rem 0}
.services-strip-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:2rem;text-align:center}
.service-item h4{font-family:var(--font-display);font-size:1rem;letter-spacing:0.08em;text-transform:uppercase;color:var(--white);margin-bottom:0.4rem}
.service-item p{font-size:0.88rem}
.service-dot{width:8px;height:8px;background:var(--green);border-radius:50%;margin:0 auto 1rem}
@keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
.fade-up{opacity:0;animation:fadeUp 0.6s ease forwards}
.fade-up.delay-1{animation-delay:0.15s}
.fade-up.delay-2{animation-delay:0.3s}
.fade-up.delay-3{animation-delay:0.45s}
@media(max-width:900px){.nav-links{display:none}.nav-toggle{display:flex}.nav-links.open{display:flex;flex-direction:column;position:absolute;top:var(--nav-height);left:0;right:0;background:var(--dark-surface);border-bottom:1px solid var(--dark-border);padding:1rem;gap:0.25rem}.intro-grid{grid-template-columns:1fr}.intro-stats{grid-template-columns:repeat(4,1fr)}.services-strip-grid{grid-template-columns:repeat(2,1fr)}.footer-inner{grid-template-columns:1fr 1fr}.form-grid{grid-template-columns:1fr}}
@media(max-width:600px){section{padding:4rem 0}.intro-stats{grid-template-columns:1fr 1fr}.services-strip-grid{grid-template-columns:1fr 1fr}.footer-inner{grid-template-columns:1fr}.footer-bottom{flex-direction:column;align-items:flex-start}.project-grid{grid-template-columns:1fr}}

body { min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; background:var(--dark); padding:2rem 1.5rem; position:relative; overflow-x:hidden; }
